name: Rettertueten-Check
on:
  schedule:
    - cron: "7 */2 * * *"   # alle 2 Stunden (Zeit in UTC)
  workflow_dispatch:         # erlaubt manuellen Start
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Seite prüfen
        run: |
          URL="https://shop.eiswieser.de/Lieblingsretter/RETTER.2"
          curl -sL -A "Mozilla/5.0" "$URL" -o page.html
          echo "Seitengröße: $(wc -c < page.html) Bytes"
          # Zum Anpassen: relevante Stellen ins Log schreiben
          grep -ioE ".{0,120}(liebling|gro(ß|ss)|ausverkauft|nicht verf|warenkorb).{0,120}" page.html | head -40 || true

          if grep -qiE "liebling|gro(ß|ss)" page.html && ! grep -qiE "ausverkauft|nicht verfügbar|nicht lieferbar" page.html; then
            curl -s -H "Title: Rettertüte verfügbar!" -H "Click: $URL" -H "Tags: icecream" -H "Priority: high" \
              -d "Liebling oder Groß gefunden: $URL" https://ntfy.sh/eiswieser-retter
            echo "Benachrichtigung gesendet."
          else
            echo "Nichts verfügbar."
          fi
