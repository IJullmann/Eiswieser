name: Rettertueten-Check
on:
  schedule:
    # GitHub rechnet in UTC. 6-21 UTC deckt 8-22 Uhr deutsche Zeit (Winter und Sommer) ab,
    # das Skript filtert unten auf gerade Stunden zwischen 8 und 22 Uhr.
    - cron: "7 6-21 * * 1-5"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Liebling und Gross pruefen
        run: |
          H=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$H" -lt 8 ] || [ "$H" -gt 22 ] || [ $((H % 2)) -ne 0 ]; then
              echo "Ausserhalb des Zeitfensters (Berlin: $H Uhr) - uebersprungen."
              exit 0
            fi
          fi

          FOUND=""
          check() {
            NAME="$1"; URL="$2"
            curl -sL -A "Mozilla/5.0" "$URL" -o page.html
            STATUS=$(grep -oiE 'schema.org/[A-Za-z]+' page.html | grep -iE 'stock|availab|order|sold|discont' | head -1)
            if grep -qiE 'schema.org/(InStock|LimitedAvailability|PreOrder)' page.html && ! grep -q 'Nicht mehr verfügbar' page.html; then
              echo "$NAME: VERFUEGBAR ($STATUS)"
              FOUND="${FOUND}${NAME} ist bestellbar: ${URL}"$'\n'
            else
              echo "$NAME: nicht verfuegbar ($STATUS)"
            fi
          }

          check "Liebling" "https://shop.eiswieser.de/Lieblingsretter/RETTER.2"
          check "Gross"    "https://shop.eiswieser.de/Grosser-Retter/RETTER.3"

          if [ -n "$FOUND" ]; then
            curl -s -H "Title: Rettertuete verfuegbar!" -H "Tags: icecream" -H "Priority: high" \
              -H "Click: https://shop.eiswieser.de/Grosser-Retter/RETTER.3" \
              -d "$FOUND" https://ntfy.sh/eiswieser-retter
            echo "Benachrichtigung gesendet."
          fi
